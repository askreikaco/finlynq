name: typecheck

on:
  pull_request:
  push:
    branches: [custom]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsc:
    # Labels match deploy-custom.yml. The only runner on this repo is the droplet
    # runner finlynq-custom; its systemd unit is capped (MemoryMax ~1-2 GB), so
    # tsc runs with a matching heap cap below.
    runs-on: ${{ vars.CI_RUNNER || fromJSON('["self-hosted","droplet"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Same generated file the prebuild hook makes; --ignore-scripts skips it.
      - name: Generate MCP tool catalog
        run: npm run generate:mcp-catalog

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=1536
        run: npx tsc --noEmit

      - name: Job summary
        if: always()
        run: |
          {
            echo "### typecheck gate"
            echo "- Nightly finlynq image builds (Dockerfile builder, finlynq-deploy.sh) set SKIP_NEXT_TYPECHECK=1: next build does NOT typecheck."
            echo "- This workflow (tsc --noEmit on custom) is the typecheck gate for custom."
            echo "- A red run here means a type error would ship in the nightly image."
          } >> "$GITHUB_STEP_SUMMARY"
