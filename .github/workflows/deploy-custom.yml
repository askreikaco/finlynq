name: Deploy Custom

# NEUTRALISED in fork: self-hosted runner does not exist.
# Deploy script: /usr/local/bin/finlynq-deploy.sh

on:
  push:
    branches: [custom]
    paths-ignore:
      - 'mobile/**'

concurrency:
  group: deploy-custom
  cancel-in-progress: false

jobs:
  deploy:
    # Only run in the original repository, not in forks
    if: github.repository == 'finlynq/finlynq'
    name: Deploy to money.reika.vn
    runs-on: [self-hosted, droplet]
    environment:
      name: custom
      url: https://money.reika.vn

    steps:
      - name: Trigger deploy script
        run: sudo /usr/local/bin/finlynq-deploy.sh
