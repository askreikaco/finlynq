name: Deploy Custom

on:
  push:
    branches: [custom]
    paths-ignore:
      - 'mobile/**'

concurrency:
  group: deploy-custom
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to money.reika.vn
    runs-on: [self-hosted, droplet]
    environment:
      name: custom
      url: https://money.reika.vn

    steps:
      - name: Trigger deploy script
        run: sudo /usr/local/bin/deploy-finlynq.sh
