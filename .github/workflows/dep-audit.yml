name: Dependency Audit

# FINLYNQ-256 — recurring guard so production-dependency advisories never
# accumulate silently again. Runs the same `npm audit --omit=dev` check that
# gates this repo's "security-first" positioning, and FAILS on any high (or
# worse) advisory in production dependencies.
#
# Triggers:
#   - schedule: monthly (1st of the month, 06:00 UTC)
#   - workflow_dispatch: manual run so the first run is immediately visible
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (set by the watchdog/rescue jobs: PC -> GitHub-hosted -> droplet)"
        required: false
        default: ""

jobs:
  audit:
    name: npm audit (production deps)
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high)
        # `--omit=dev` scopes the audit to what actually ships. `--audit-level=high`
        # exits non-zero only on high/critical advisories, matching the acceptance
        # bar (0 high). Moderate/low advisories are surfaced in the log below but
        # do not fail the run (many require breaking major downgrades to clear).
        run: npm audit --omit=dev --audit-level=high

      - name: Full advisory report (informational)
        if: always()
        run: npm audit --omit=dev || true

  # Tier chain (owner 2026-10-15): PC runner (reika-pc) -> GitHub-hosted (ubuntu-latest) -> droplet (reika-droplet).
  # watchdog/rescue run on ubuntu-latest and re-dispatch this workflow ONE tier down; the droplet is the last tier.
  # Kill switch: repo var CI_RUNNER (reika-droplet = droplet only, reika-pc = start on the PC).

  # Watchdog: if audit has not started within 120 s, re-dispatch dep-audit.yml one tier down and cancel
  # this run. A cancelled run is not "failure", so `rescue` below does not also re-dispatch it.
  watchdog:
    if: ${{ (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Re-dispatch one tier down if audit does not start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          for _ in $(seq 1 12); do
            status=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -r '[.jobs[] | select(.name == "npm audit (production deps)")][0].status // "queued"')
            if [ "$status" != "queued" ]; then
              echo "runner $CUR picked up the job (audit: $status); no re-dispatch"
              exit 0
            fi
            sleep 10
          done
          echo "audit still queued on $CUR after 120 s ($EVENT on $REF): re-dispatching dep-audit.yml to $next"
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          if ! api -X POST -H "Content-Type: application/json" "$API/actions/workflows/dep-audit.yml/dispatches" -d "$body" > /dev/null; then
            echo "::error::dispatch of dep-audit.yml on $REF to $next failed; run $RUN_ID NOT cancelled"
            exit 1
          fi
          echo "Dispatched dep-audit.yml on $REF with runner=$next"
          api -X POST "$API/actions/runs/$RUN_ID/cancel" > /dev/null
          echo "Cancelled run $RUN_ID ($CUR did not start audit within 120 s)"

  # Rescue: audit ended without really testing (refused: failed with no step ever run, e.g. hosted
  # billing limit; or runner lost / shutdown signal / Set up job failure) -> re-dispatch dep-audit.yml one
  # tier down. In-run on purpose: runs dispatched with GITHUB_TOKEN (every hop after the first) do not
  # fire workflow_run, so fallback.yml cannot see them. A real test failure (steps ran, no
  # runner-lost annotation) is never re-dispatched. Loop-safe: tiers only go down and the droplet has
  # none; one re-dispatch per sha (a later workflow_dispatch run at the same sha blocks another);
  # a superseded sha (branch moved on) is skipped.
  rescue:
    needs: audit
    if: ${{ always() && (needs.audit.result == 'failure' || needs.audit.result == 'cancelled') && (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read

    steps:
      - name: Re-dispatch one tier down if audit was refused or its runner was lost
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          job=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -c '[.jobs[] | select(.name == "npm audit (production deps)")][0] // empty')
          if [ -z "$job" ]; then echo "no audit job in run $RUN_ID: nothing to do"; exit 0; fi
          cand=$(jq -r '.id' <<<"$job")
          nsteps=$(jq '(.steps // []) | length' <<<"$job")
          concl=$(jq -r '.conclusion // ""' <<<"$job")
          refused=0
          if [ "$concl" = failure ] && [ "$nsteps" -eq 0 ]; then refused=1; fi
          setup_failed=$(jq -r '[(.steps // [])[] | select((.name == "Set up job" or .name == "Set up runner") and .conclusion == "failure")] | length' <<<"$job")
          ann=$(api "$API/check-runs/$cand/annotations?per_page=50" | jq -r '[.[].message] | join("\n")') || { ann=""; echo "::warning::could not read annotations of job $cand"; }
          lost=0
          if grep -qE '^(The (self-hosted |hosted )?runner: .*lost communication with the server|The runner has received a shutdown signal)' <<<"$ann"; then lost=1; fi
          # Timeout on reika-pc = runner-side hang (audit ran past timeout-minutes 25): one hop down. Hosted/droplet timeouts stay red.
          timed_out=0; if [ "$CUR" = reika-pc ] && grep -q 'exceeded the maximum execution time' <<<"$ann"; then timed_out=1; fi
          if [ "$refused" -eq 0 ] && [ "$setup_failed" -eq 0 ] && [ "$lost" -eq 0 ] && [ "$timed_out" -eq 0 ]; then
            echo "audit job $cand on $CUR ended '$concl' for a real reason (steps ran, no refusal / runner-lost signal): not re-dispatching"
            exit 0
          fi
          head_now=$(api "$API/git/ref/heads/$REF" | jq -r '.object.sha // empty') || head_now=""
          if [ "$head_now" != "$SHA" ]; then
            echo "branch $REF is at '${head_now:-gone}', run was for $SHA: superseded, not re-dispatching"
            exit 0
          fi
          created=$(api "$API/actions/runs/$RUN_ID" | jq -r '.created_at')
          later=$(api "$API/actions/workflows/dep-audit.yml/runs?event=workflow_dispatch&head_sha=$SHA&per_page=50" | jq --arg c "$created" --argjson me "$RUN_ID" '[.workflow_runs[] | select(.id != $me and .created_at > $c)] | length')
          if [ "$later" -gt 0 ]; then
            echo "$later later workflow_dispatch run(s) of dep-audit.yml exist for $SHA: already re-dispatched, not again"
            exit 0
          fi
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          api -X POST -H "Content-Type: application/json" "$API/actions/workflows/dep-audit.yml/dispatches" -d "$body"
          echo "audit on $CUR refused/lost (job $cand, refused=$refused setup_failed=$setup_failed lost=$lost): re-dispatched dep-audit.yml on $REF (sha $SHA) to $next"
