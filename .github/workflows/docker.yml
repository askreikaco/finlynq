name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/entrypoint.sh'
      - 'scripts/run-migrations.mjs'
      - 'scripts/baseline/**'
      - 'scripts/migrations/**'
      - '.github/workflows/docker.yml'

  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (set by the watchdog/rescue jobs: PC -> GitHub-hosted -> droplet)"
        required: false
        default: ""

jobs:
  # ── Smoke test ───────────────────────────────────────────────────────────────
  # Boots the image the way a self-hoster does and proves it reaches a
  # REGISTERABLE instance. Added after GH #312, where four compounding defects
  # shipped in every published tag from 3.2.0 to 3.3.2 because nothing in CI had
  # ever started the container. A build that compiles is not evidence the image
  # works.
  #
  # The schema assertions at the end are the load-bearing part: a health check
  # alone passes against a half-built database. #312's bugs 3 and 4 were exactly
  # that — the app booted and then 500'd on registration because ~half the schema
  # was missing.
  smoke:
    name: Smoke test (boot + register + schema)
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image locally
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          # Tag as the name docker-compose.yml references so compose uses this
          # local build instead of pulling the published (possibly broken) tag.
          tags: ghcr.io/finlynq/finlynq:latest

      - name: Generate throwaway secrets
        run: |
          {
            echo "PF_JWT_SECRET=$(openssl rand -hex 32)"
            echo "PF_PEPPER=$(openssl rand -hex 32)"
            echo "PF_STAGING_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      # Exactly the documented Quick Start, no patching. If this step ever needs
      # a workaround, the README needs a fix — not this workflow.
      - name: docker compose up
        run: docker compose up -d

      - name: Wait for /api/healthz
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/healthz || true)
            if [ "$code" = "200" ]; then echo "healthy after ~${i}0s"; exit 0; fi
            sleep 10
          done
          echo "::error::app never became healthy"
          docker compose logs app
          exit 1

      - name: Register a user (the check a health probe cannot make)
        run: |
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://localhost:3000' \
            -d '{"username":"smoketest","password":"correct-horse-battery-staple-42","acknowledgeNoRecovery":true}')
          echo "HTTP $code"; cat /tmp/reg.json; echo
          case "$code" in
            200|201) echo "registration ok" ;;
            *)
              echo "::error::registration failed with HTTP $code — schema is probably incomplete"
              docker compose logs app | tail -60
              exit 1
              ;;
          esac

      # Floors, not exact counts, so ordinary schema growth doesn't churn this.
      # They sit far above what a partial migration produces: #312 shipped a
      # 21-table database, and a from-zero replay of the migration chain alone
      # yields 43 tables.
      - name: Assert the schema is complete
        run: |
          q() { docker compose exec -T db psql -U pf -d pf -tAc "$1" | tr -d '[:space:]'; }
          tables=$(q "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r'")
          checks=$(q "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE c.contype='c' AND n.nspname='public'")
          partial=$(q "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexdef LIKE '%WHERE%'")
          ledger=$(q "SELECT count(*) FROM schema_migrations")
          echo "tables=$tables checks=$checks partial_indexes=$partial ledger=$ledger"
          fail=0
          [ "$tables"  -ge 68 ] || { echo "::error::only $tables tables (expected >= 68)"; fail=1; }
          [ "$checks"  -ge 52 ] || { echo "::error::only $checks CHECK constraints (expected >= 52)"; fail=1; }
          [ "$partial" -ge 27 ] || { echo "::error::only $partial partial indexes (expected >= 27)"; fail=1; }
          [ "$ledger"  -ge 70 ] || { echo "::error::only $ledger ledger rows (expected >= 70)"; fail=1; }
          exit $fail

      # Every table the ORM models must exist. Catches the #312 class of defect
      # head-on: a table defined in schema-pg.ts that no DDL in the image creates.
      - name: Assert every schema-pg.ts table exists
        run: |
          docker compose exec -T db psql -U pf -d pf -tAc \
            "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r'" \
            | tr -d '\r' | sed '/^$/d' | sort -u > /tmp/live_tables.txt
          grep -oE 'pgTable\("[a-z_]+"' src/db/schema-pg.ts | sed 's/pgTable("//;s/"//' | sort -u > /tmp/orm_tables.txt
          missing=$(comm -23 /tmp/orm_tables.txt /tmp/live_tables.txt)
          if [ -n "$missing" ]; then
            echo "::error::tables defined in schema-pg.ts with no DDL in the shipped image:"
            echo "$missing"
            exit 1
          fi
          echo "all $(wc -l < /tmp/orm_tables.txt) ORM-modelled tables present"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Publish ──────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/finlynq/finlynq
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Tier chain (owner 2026-10-15): PC runner (reika-pc) -> GitHub-hosted (ubuntu-latest) -> droplet (reika-droplet).
  # watchdog/rescue run on ubuntu-latest and re-dispatch this workflow ONE tier down; the droplet is the last tier.
  # Kill switch: repo var CI_RUNNER (reika-droplet = droplet only, reika-pc = start on the PC).

  # Watchdog: if smoke has not started within 120 s, re-dispatch docker.yml one tier down and cancel
  # this run. A cancelled run is not "failure", so `rescue` below does not also re-dispatch it.
  watchdog:
    if: ${{ (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Re-dispatch one tier down if smoke does not start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          for _ in $(seq 1 12); do
            status=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -r '[.jobs[] | select(.name == "Smoke test (boot + register + schema)")][0].status // "queued"')
            if [ "$status" != "queued" ]; then
              echo "runner $CUR picked up the job (smoke: $status); no re-dispatch"
              exit 0
            fi
            sleep 10
          done
          echo "smoke still queued on $CUR after 120 s ($EVENT on $REF): re-dispatching docker.yml to $next"
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          if ! api -X POST -H "Content-Type: application/json" "$API/actions/workflows/docker.yml/dispatches" -d "$body" > /dev/null; then
            echo "::error::dispatch of docker.yml on $REF to $next failed; run $RUN_ID NOT cancelled"
            exit 1
          fi
          echo "Dispatched docker.yml on $REF with runner=$next"
          api -X POST "$API/actions/runs/$RUN_ID/cancel" > /dev/null
          echo "Cancelled run $RUN_ID ($CUR did not start smoke within 120 s)"

  # Rescue: smoke ended without really testing (refused: failed with no step ever run, e.g. hosted
  # billing limit; or runner lost / shutdown signal / Set up job failure) -> re-dispatch docker.yml one
  # tier down. In-run on purpose: runs dispatched with GITHUB_TOKEN (every hop after the first) do not
  # fire workflow_run, so fallback.yml cannot see them. A real test failure (steps ran, no
  # runner-lost annotation) is never re-dispatched. Loop-safe: tiers only go down and the droplet has
  # none; one re-dispatch per sha (a later workflow_dispatch run at the same sha blocks another);
  # a superseded sha (branch moved on) is skipped.
  rescue:
    needs: smoke
    if: ${{ always() && (needs.smoke.result == 'failure' || needs.smoke.result == 'cancelled') && (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read

    steps:
      - name: Re-dispatch one tier down if smoke was refused or its runner was lost
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          job=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -c '[.jobs[] | select(.name == "Smoke test (boot + register + schema)")][0] // empty')
          if [ -z "$job" ]; then echo "no smoke job in run $RUN_ID: nothing to do"; exit 0; fi
          cand=$(jq -r '.id' <<<"$job")
          nsteps=$(jq '(.steps // []) | length' <<<"$job")
          concl=$(jq -r '.conclusion // ""' <<<"$job")
          refused=0
          if [ "$concl" = failure ] && [ "$nsteps" -eq 0 ]; then refused=1; fi
          setup_failed=$(jq -r '[(.steps // [])[] | select((.name == "Set up job" or .name == "Set up runner") and .conclusion == "failure")] | length' <<<"$job")
          ann=$(api "$API/check-runs/$cand/annotations?per_page=50" | jq -r '[.[].message] | join("\n")') || { ann=""; echo "::warning::could not read annotations of job $cand"; }
          lost=0
          if grep -qE '^(The (self-hosted |hosted )?runner: .*lost communication with the server|The runner has received a shutdown signal)' <<<"$ann"; then lost=1; fi
          # Timeout on reika-pc = runner-side hang (smoke ran past timeout-minutes 25): one hop down. Hosted/droplet timeouts stay red.
          timed_out=0; if [ "$CUR" = reika-pc ] && grep -q 'exceeded the maximum execution time' <<<"$ann"; then timed_out=1; fi
          if [ "$refused" -eq 0 ] && [ "$setup_failed" -eq 0 ] && [ "$lost" -eq 0 ] && [ "$timed_out" -eq 0 ]; then
            echo "smoke job $cand on $CUR ended '$concl' for a real reason (steps ran, no refusal / runner-lost signal): not re-dispatching"
            exit 0
          fi
          head_now=$(api "$API/git/ref/heads/$REF" | jq -r '.object.sha // empty') || head_now=""
          if [ "$head_now" != "$SHA" ]; then
            echo "branch $REF is at '${head_now:-gone}', run was for $SHA: superseded, not re-dispatching"
            exit 0
          fi
          created=$(api "$API/actions/runs/$RUN_ID" | jq -r '.created_at')
          later=$(api "$API/actions/workflows/docker.yml/runs?event=workflow_dispatch&head_sha=$SHA&per_page=50" | jq --arg c "$created" --argjson me "$RUN_ID" '[.workflow_runs[] | select(.id != $me and .created_at > $c)] | length')
          if [ "$later" -gt 0 ]; then
            echo "$later later workflow_dispatch run(s) of docker.yml exist for $SHA: already re-dispatched, not again"
            exit 0
          fi
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          api -X POST -H "Content-Type: application/json" "$API/actions/workflows/docker.yml/dispatches" -d "$body"
          echo "smoke on $CUR refused/lost (job $cand, refused=$refused setup_failed=$setup_failed lost=$lost): re-dispatched docker.yml on $REF (sha $SHA) to $next"
