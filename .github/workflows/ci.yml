name: CI

on:
  pull_request:
    branches: [main, dev]
    # Mobile-only PRs are covered by mobile-ci.yml — skip the web build for them.
    paths-ignore:
      - 'mobile/**'

  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (set by the watchdog/rescue jobs: PC -> GitHub-hosted -> droplet)"
        required: false
        default: ""

jobs:
  validate:
    name: Typecheck & Build
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finlynq_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # FINLYNQ-112 — ESLint runs blocking on errors. The 12 rules with a
        # pre-existing violation backlog are downgraded to `warn` in
        # eslint.config.mjs (the FINLYNQ-112 baseline), so this gates on any
        # NEW error rule today and grows teeth as the backlog is burned down.
        run: npm run lint

      - name: Audit load-bearing invariants
        # FINLYNQ-48 — grep-walk INSERT/UPDATE sites for required helpers.
        # FINLYNQ-112 — promoted from advisory to blocking (passes 11/11 on HEAD).
        run: npm run audit:invariants

      - name: Lint MCP tool descriptions
        # FINLYNQ-266 — enumerate the registered HTTP tool surface and fail on
        # duplicate first-60-char openings, first sentences >120 chars, or
        # descriptions >900 chars. Keeps the verb-first style guide enforced so
        # truncating clients never render two tools as the same string.
        run: npm run lint:tool-descriptions

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finlynq_ci
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Create test database
        # The real-Postgres aggregator harness (tests/helpers/portfolio-fixtures.ts)
        # refuses any DATABASE_URL whose DB name lacks `_test`. Those suites are
        # currently quarantined (see vitest.config.ts), but provisioning the DB now
        # means un-quarantining one only needs a drizzle-kit schema push, not new CI.
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname='finlynq_test'" | grep -q 1 \
            || PGPASSWORD=postgres createdb -h localhost -U postgres finlynq_test

      - name: Apply schema to finlynq_test
        # FINLYNQ-260 follow-up — `createdb` above only provisions an empty
        # database. The real-Postgres aggregator harness
        # (tests/helpers/portfolio-fixtures.ts) TRUNCATEs/seeds tables that
        # don't exist without a schema, which fails any un-quarantined
        # DB-backed test (e.g. tests/mcp/readonly-contract.test.ts).
        #
        # 2026-09-17 — this was `drizzle-kit push --force`, which builds ONLY
        # what `src/db/schema-pg.ts` declares. That is a different schema from
        # the one every real deployment has, and the gap was measured at 94
        # index shapes, 53 CHECK constraints, 6 foreign keys and 4 columns
        # (GH #348 / #352). The suite was therefore green against a database
        # that could not reproduce a whole class of production failure: an
        # `ON CONFLICT` with no backing unique index (42P10) or a write that
        # violates a CHECK (23514), both of which our callsites swallow.
        # `npm run db:migrate` is `scripts/run-migrations.mjs` — the SAME
        # runner `deploy.sh` and the Docker entrypoint call. `createdb` leaves
        # the database empty, so its baseline guard fires and it applies
        # `scripts/baseline/0001_schema_baseline.sql` then every migration not
        # yet in `schema_migrations`. It needs only `pg` + DATABASE_URL.
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finlynq_test

      - name: Run tests
        # FINLYNQ-257 — `vitest run` gates the suite. The currently-red files are
        # quarantined in vitest.config.ts (QUARANTINE array); CI fails on any
        # non-quarantined regression. Burn the quarantine down over time.
        run: npx vitest run
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finlynq_test
          PF_PEPPER: ci-test-pepper-000000000000000000000000000000
          PF_STAGING_KEY: ci-test-staging-0000000000000000000000000000
          PF_JWT_SECRET: ci-test-jwt-00000000000000000000000000000000

  # Tier chain (owner 2026-10-15): PC runner (reika-pc) -> GitHub-hosted (ubuntu-latest) -> droplet (reika-droplet).
  # watchdog/rescue run on ubuntu-latest and re-dispatch this workflow ONE tier down; the droplet is the last tier.
  # Kill switch: repo var CI_RUNNER (reika-droplet = droplet only, reika-pc = start on the PC).

  # Watchdog: if validate has not started within 120 s, re-dispatch ci.yml one tier down and cancel
  # this run. A cancelled run is not "failure", so `rescue` below does not also re-dispatch it.
  watchdog:
    if: ${{ (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Re-dispatch one tier down if validate does not start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          for _ in $(seq 1 12); do
            status=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -r '[.jobs[] | select(.name == "Typecheck & Build")][0].status // "queued"')
            if [ "$status" != "queued" ]; then
              echo "runner $CUR picked up the job (validate: $status); no re-dispatch"
              exit 0
            fi
            sleep 10
          done
          echo "validate still queued on $CUR after 120 s ($EVENT on $REF): re-dispatching ci.yml to $next"
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          if ! api -X POST -H "Content-Type: application/json" "$API/actions/workflows/ci.yml/dispatches" -d "$body" > /dev/null; then
            echo "::error::dispatch of ci.yml on $REF to $next failed; run $RUN_ID NOT cancelled"
            exit 1
          fi
          echo "Dispatched ci.yml on $REF with runner=$next"
          api -X POST "$API/actions/runs/$RUN_ID/cancel" > /dev/null
          echo "Cancelled run $RUN_ID ($CUR did not start validate within 120 s)"

  # Rescue: validate ended without really testing (refused: failed with no step ever run, e.g. hosted
  # billing limit; or runner lost / shutdown signal / Set up job failure) -> re-dispatch ci.yml one
  # tier down. In-run on purpose: runs dispatched with GITHUB_TOKEN (every hop after the first) do not
  # fire workflow_run, so fallback.yml cannot see them. A real test failure (steps ran, no
  # runner-lost annotation) is never re-dispatched. Loop-safe: tiers only go down and the droplet has
  # none; one re-dispatch per sha (a later workflow_dispatch run at the same sha blocks another);
  # a superseded sha (branch moved on) is skipped.
  rescue:
    needs: validate
    if: ${{ always() && (needs.validate.result == 'failure' || needs.validate.result == 'cancelled') && (inputs.runner || vars.CI_RUNNER || 'reika-pc') != 'reika-droplet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read

    steps:
      - name: Re-dispatch one tier down if validate was refused or its runner was lost
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CUR: ${{ inputs.runner || vars.CI_RUNNER || 'reika-pc' }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          case "$CUR" in reika-pc|reika-ci) next=ubuntu-latest ;; reika-droplet) next=none ;; *) next=reika-droplet ;; esac
          [ "$next" = none ] && { echo "$CUR is the last tier: nothing to re-dispatch"; exit 0; }
          job=$(api "$API/actions/runs/$RUN_ID/jobs?per_page=100" | jq -c '[.jobs[] | select(.name == "Typecheck & Build")][0] // empty')
          if [ -z "$job" ]; then echo "no validate job in run $RUN_ID: nothing to do"; exit 0; fi
          cand=$(jq -r '.id' <<<"$job")
          nsteps=$(jq '(.steps // []) | length' <<<"$job")
          concl=$(jq -r '.conclusion // ""' <<<"$job")
          refused=0
          if [ "$concl" = failure ] && [ "$nsteps" -eq 0 ]; then refused=1; fi
          setup_failed=$(jq -r '[(.steps // [])[] | select((.name == "Set up job" or .name == "Set up runner") and .conclusion == "failure")] | length' <<<"$job")
          ann=$(api "$API/check-runs/$cand/annotations?per_page=50" | jq -r '[.[].message] | join("\n")') || { ann=""; echo "::warning::could not read annotations of job $cand"; }
          lost=0
          if grep -qE '^(The (self-hosted |hosted )?runner: .*lost communication with the server|The runner has received a shutdown signal)' <<<"$ann"; then lost=1; fi
          # Timeout on reika-pc = runner-side hang (validate ran past timeout-minutes 25): one hop down. Hosted/droplet timeouts stay red.
          timed_out=0; if [ "$CUR" = reika-pc ] && grep -q 'exceeded the maximum execution time' <<<"$ann"; then timed_out=1; fi
          if [ "$refused" -eq 0 ] && [ "$setup_failed" -eq 0 ] && [ "$lost" -eq 0 ] && [ "$timed_out" -eq 0 ]; then
            echo "validate job $cand on $CUR ended '$concl' for a real reason (steps ran, no refusal / runner-lost signal): not re-dispatching"
            exit 0
          fi
          head_now=$(api "$API/git/ref/heads/$REF" | jq -r '.object.sha // empty') || head_now=""
          if [ "$head_now" != "$SHA" ]; then
            echo "branch $REF is at '${head_now:-gone}', run was for $SHA: superseded, not re-dispatching"
            exit 0
          fi
          created=$(api "$API/actions/runs/$RUN_ID" | jq -r '.created_at')
          later=$(api "$API/actions/workflows/ci.yml/runs?event=workflow_dispatch&head_sha=$SHA&per_page=50" | jq --arg c "$created" --argjson me "$RUN_ID" '[.workflow_runs[] | select(.id != $me and .created_at > $c)] | length')
          if [ "$later" -gt 0 ]; then
            echo "$later later workflow_dispatch run(s) of ci.yml exist for $SHA: already re-dispatched, not again"
            exit 0
          fi
          body=$(jq -nc --arg ref "$REF" --arg r "$next" '{ref:$ref, inputs:{runner:$r}}')
          api -X POST -H "Content-Type: application/json" "$API/actions/workflows/ci.yml/dispatches" -d "$body"
          echo "validate on $CUR refused/lost (job $cand, refused=$refused setup_failed=$setup_failed lost=$lost): re-dispatched ci.yml on $REF (sha $SHA) to $next"
